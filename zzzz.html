<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="js-collection-of-buttons">
    
  </div>
  
  <script>
    const array=[{
      id: 1,
      name:'Ram'
    },
  {
      id: 2,
      name: 'Sita'
    },
  {
      id: 3,
      name: 'Hari'
    },
  {
      id: 4,
      name: 'Ram'
    }];

    let buttonsHTML='';

    array.forEach((item)=>{
      buttonsHTML+=`
      <button class="js-button">
      ${item.id}-${item.name}</button>`;
    });

    document.querySelector('.js-collection-of-buttons').innerHTML=buttonsHTML;

    let count = 0;
    document.querySelectorAll('.js-button').forEach((item)=>{
      
      count++;
      console.log(count);
    });
    
    
  </script>
</body>
</html>
