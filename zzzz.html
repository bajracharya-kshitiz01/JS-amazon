<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zzzz</title>
  <style>
    .ello-button{
      background-color: green;
    }
    .Ello-Button{
      font-size: 30px;
      background-color: yellow;
      padding: 20px;
      border:none;
    }
  </style>
</head>
<body>
  <button class="ello-button">
    Ello!
  </button>
  <script>
    document.querySelector('.ello-button').addEventListener('click',()=>{
      const change= document.querySelector('.ello-button');
      change.classList.add('Ello-Button');
    })
  </script>
</body>
</html>
